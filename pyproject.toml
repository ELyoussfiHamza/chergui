[project]
name = "chergui"
version = "0.1.0"
description = "Stress-test PX4 drones in simulated Moroccan Sahara conditions (Chergui wind, GPS blackouts), judge the flight logs, and write the incident report."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mavsdk>=4.2.0",
    "openai>=1.0",
    "python-dotenv>=1.2.4",
    "pyulog>=1.3.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
chergui = "chergui.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"
